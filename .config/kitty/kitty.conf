# vim:fileencoding=utf-8:foldmethod=marker

# Font settings
font_family JetBrainsMono Nerd Font Mono Light
bold_font JetBrainsMono Nerd Font SemiBold Mono
italic_font JetBrainsMono Nerd Font Mono Light Italic
bold_italic_font JetBrainsMono Nerd Font Mono SemiBold Italic
font_size 14.0
font_features none

# Cursor
cursor_blink_interval 0

# Window
hide_window_decorations titlebar-only

# Misc
macos_option_as_alt yes

allow_remote_control socket-only
listen_on unix:/tmp/kitty-${USER}.socket

# Both files are symlinks maintained by theme-set, pointing into
# themes/<active>/. current-opacity.conf carries background_opacity, which
# differs per theme (Rosé Pine is translucent, the rest are opaque).
include current-opacity.conf
include current-theme.conf

background_opacity 0.9
